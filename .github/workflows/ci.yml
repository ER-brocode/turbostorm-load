name: TurboStorm Load CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Load Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Module Dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod

      - name: Run Unit & Integration Tests
        run: |
          go test -v -race ./...

      - name: Build Binary
        run: |
          go build -v -ldflags="-s -w" -o bin/turbostorm ./cmd/turbostorm

      - name: Smoke Test Binary
        run: |
          ./bin/turbostorm --help
